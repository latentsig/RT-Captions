[package]
name = "rt-captions"
version = "0.2.0"
edition = "2021"
default-run = "rt-captions-app"
autobins = false

[lib]
name = "rt_captions_lib"
crate-type = ["rlib"]

[[bin]]
name = "rt-captions-app"
path = "src/main.rs"

[[bin]]
name = "rt-captions"
path = "src/bin/rt-captions.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9.0"
cpal = "0.15"
rubato = "0.16"
nnnoiseless = "0.5.2"
anyhow = "1.0.104"
hound = "3.5.1"
dirs = "7.0.0"
tauri-plugin-single-instance = "2"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSObject", "NSProcessInfo"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMBlockBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
block2 = "0.6"
dispatch2 = "0.3"

[profile.release]
lto = true
codegen-units = 1
