[package]
name = "rt-captions"
version = "0.1.0"
edition = "2021"
default-run = "rt-captions-app"
autobins = false

[lib]
name = "rt_captions_lib"
crate-type = ["rlib"]

[[bin]]
name = "rt-captions-app"
path = "src/main.rs"

[[bin]]
name = "rt-captions"
path = "src/bin/rt-captions.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9.0"
cpal = "0.15"
rubato = "0.16"
nnnoiseless = "0.5.2"
anyhow = "1.0.104"
hound = "3.5.1"
dirs = "7.0.0"
tauri-plugin-single-instance = "2"
ureq = "2"

[profile.release]
lto = true
codegen-units = 1
